<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embate Eleitoral</title>
  <meta name="theme-color" content="#0d0f1a">
  <meta name="description" content="Apuração presidencial como luta de anime em pixel art, com dados ao vivo do TSE.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="src/img/icones/icone-192.png">
  <link rel="apple-touch-icon" href="src/img/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="topo">
      <h1>EMBATE <span>ELEITORAL</span> <small id="ano"></small></h1>
      <div class="controles">
        <div class="turnos" role="group" aria-label="Turno">
          <button data-turno="auto" class="ativo">AUTO</button>
          <button data-turno="1">1º TURNO</button>
          <button data-turno="2">2º TURNO</button>
        </div>
        <div class="turnos estilos" id="estilos" role="group" aria-label="Estilo do embate"></div>
        <button id="btn-widget" class="btn-widget" title="Abre a luta numa janelinha que fica por cima das outras">WIDGET</button>
      </div>
    </header>
    <p class="dica-widget" id="dica-widget" hidden></p>

    <section class="hud" aria-live="polite">
      <div class="lutador esq">
        <div class="nome"><b id="nome-esquerda"></b> <small id="info-esquerda"></small></div>
        <div class="barra"><i id="barra-esquerda"></i></div>
        <div class="pct" id="pct-esquerda">--,--%</div>
        <div class="votos" id="votos-esquerda">— votos</div>
      </div>
      <div class="vs">VS</div>
      <div class="lutador dir">
        <div class="nome"><small id="info-direita"></small> <b id="nome-direita"></b></div>
        <div class="barra"><i id="barra-direita"></i></div>
        <div class="pct" id="pct-direita">--,--%</div>
        <div class="votos" id="votos-direita">— votos</div>
      </div>
    </section>

    <div class="arena">
      <canvas id="arena" width="320" height="160"></canvas>
      <div class="faixa" id="faixa" hidden></div>
      <div class="mini-placar">
        <span class="l"><span id="mini-nome-esquerda"></span> <b id="mini-esquerda">--%</b></span>
        <span class="ap" id="mini-apurado"></span>
        <span class="f"><b id="mini-direita">--%</b> <span id="mini-nome-direita"></span></span>
      </div>
    </div>

    <section class="apuracao">
      <div class="linha">
        <span>URNAS APURADAS</span>
        <strong id="apurado">--%</strong>
      </div>
      <div class="progresso"><i id="barra-apurado"></i></div>
      <div class="meta" id="meta">Carregando dados do TSE…</div>
      <div class="extras" id="extras"></div>
    </section>

    <section class="estados">
      <h2>PLACAR POR ESTADO</h2>
      <p class="contagem" id="contagem"></p>
      <div class="mapa" id="mapa"></div>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>UF</th><th>Estado</th><th>Apurado</th>
              <th class="c-esquerda" id="th-esquerda"></th><th class="c-direita" id="th-direita"></th><th>Na frente</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </section>

    <footer>
      Dados: <a href="https://resultados.tse.jus.br" target="_blank" rel="noopener">resultados.tse.jus.br</a>
      · atualiza a cada 30s · site de brincadeira, sem vínculo com o TSE
    </footer>
  </main>
  <script src="src/js/eleicao.js"></script>
  <script src="src/js/estilos/kamehameha.js"></script>
  <script src="src/js/estilos/naruto.js"></script>
  <script src="src/js/estilos/pokemon.js"></script>
  <script src="src/js/estilos/streetfighter.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
